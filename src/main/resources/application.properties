spring.application.name=gollinho
# =================================================
# CONEXÃO COM O BANCO DE DADOS POSTGRESQL
# =================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/gollinho
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# =================================================
# CONFIGURAÇÕES DO HIBERNATE / JPA
# =================================================
# Controla a geração/atualização automática do schema (use com cuidado em produção!)
# Opções comuns: update, create, create-drop, validate, none
spring.jpa.hibernate.ddl-auto=update

# Mostra as queries SQL executadas no console (ótimo para desenvolvimento)
spring.jpa.show-sql=true

# Formata o SQL gerado para ficar mais legível no console
spring.jpa.properties.hibernate.format_sql=true
